# In CloudPanel: Sites -> your site -> Vhost. Replace the existing "location / { ... uwsgi_pass ... }"
# block with this one (keep APP_PORT the same as the site's App Port), then Save.
location / {
    proxy_pass http://127.0.0.1:APP_PORT;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;        # speech + AI + voice can take ~10-30 s per turn
    proxy_send_timeout 120s;
    client_max_body_size 5m;        # voice recordings
}
